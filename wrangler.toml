name = "ag-analytics"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Static dashboard files (HTML/CSS/JS) served directly by the Worker
[assets]
directory = "./public"
binding = "ASSETS"

# D1 database, created with: wrangler d1 create ag_analytics_db
[[d1_databases]]
binding = "DB"
database_name = "ag_analytics_db"
database_id = "08eb91d1-1c3b-4f96-8005-cacee53b8f3e"

# Weekly scheduled cleanup (see the `scheduled` handler in src/index.js):
# deletes visits/sessions/events older than the retention window so D1 storage
# doesn't grow forever. Runs every Sunday at 03:00 UTC. Cron triggers are free
# on all Workers plans, including the free tier.
[triggers]
crons = ["0 3 * * SUN"]

# Secrets (set with `wrangler secret put NAME`, never store real values here):
#   JWT_SECRET      -> random 32+ character string, used to sign admin login tokens
#   ADMIN_BOOTSTRAP -> one-time setup password, used only during the first admin creation
[vars]
APP_NAME = "AG Analytics"
# Shown in the dashboard sidebar footer, purely informational — helps tell at
# a glance whether you're looking at a freshly deployed version or a stale
# cached copy of the frontend. Bump this alongside the version in package.json
# whenever you cut a release.
APP_VERSION = "0.3.1-beta.1"
